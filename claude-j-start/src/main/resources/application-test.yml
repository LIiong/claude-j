spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:claude_j_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

jwt:
  secret: test-jwt-secret-key-at-least-32-bytes

claudej:
  rabbitmq:
    orderCreatedExchange: order.created.exchange
    orderCreatedQueue: order.created.queue
    orderCreatedRoutingKey: order.created

app:
  security:
    cors:
      enabled: false
